# Hardened installs (task F6): local socket connections (the image's health check, the backup
# service) are trusted; every network connection must use TLS and a password (SCRAM-SHA-256).
local   all   all                 trust
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
host    all   all   0.0.0.0/0     reject
host    all   all   ::/0          reject
