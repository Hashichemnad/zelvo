# Zelvo development stack. Start it with `make up` (or scripts/dev-up.sh) from the repository root.
# Ports are bound to 127.0.0.1 only. This file is for development; the hardened small-install
# compose file and Helm charts are separate Phase 1 tasks.

name: ${COMPOSE_PROJECT_NAME:-zelvo}

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      ZELVO_APP_DB_USER: ${ZELVO_APP_DB_USER:?set in .env}
      ZELVO_APP_DB_PASSWORD: ${ZELVO_APP_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cache: Valkey (BSD licence, Redis-protocol compatible). The service keeps the name "redis"
  # because clients speak the Redis protocol; see the decisions log in CLAUDE.md.
  redis:
    <<: *restart
    image: valkey/valkey:8.1-alpine
    command: ["sh", "-c", "exec valkey-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      VALKEYCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    <<: *restart
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  opensearch:
    <<: *restart
    image: opensearchproject/opensearch:3.3.0
    environment:
      discovery.type: single-node
      # Development only: the security plugin is off and the port is bound to 127.0.0.1.
      # Installs enable it with TLS and credentials (tracked in the Phase 1 plan).
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  keycloak:
    <<: *restart
    image: keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    volumes:
      - ./keycloak/zelvo-realm.json:/opt/keycloak/data/import/zelvo-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; ask the management port with bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    <<: *restart
    build:
      context: ../..
      dockerfile: src/api/Zelvo.Api/Dockerfile
    image: zelvo/api:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${ZELVO_APP_DB_USER};Password=${ZELVO_APP_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Services__OpenSearch: http://opensearch:9200/
      Services__KeycloakHealth: http://keycloak:9000/health/ready
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      # The image has no curl; ask the liveness endpoint with bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *restart
    build:
      context: ../..
      dockerfile: src/worker/Zelvo.Worker/Dockerfile
    image: zelvo/worker:dev
    environment:
      DOTNET_ENVIRONMENT: Development
      Worker__HeartbeatFile: /tmp/zelvo-worker.heartbeat
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/zelvo-worker.heartbeat -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    <<: *restart
    build:
      context: ../../src/web
    image: zelvo/web:dev
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  opensearch-data:
