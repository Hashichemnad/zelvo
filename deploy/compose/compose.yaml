# Zelvo development stack. Start it with `make up` (or scripts/dev-up.sh) from the repository root.
# Ports are bound to 127.0.0.1 only. This file is for development; the hardened small-install
# compose file and Helm charts are separate Phase 1 tasks.

name: ${COMPOSE_PROJECT_NAME:-zelvo}

x-restart: &restart
  restart: unless-stopped

# Encryption at rest for stored secrets (A5): the master key file from deploy/compose/secrets,
# created by scripts/dev-up.sh. Installs can use Vault or OpenBao instead (Secrets__Provider: Vault).
# Telemetry (A5): Zelvo's services send traces, metrics and logs over OTLP to the collector.
x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  # Metrics every 15 seconds, like Prometheus's scrape interval (the .NET default is 60).
  OTEL_METRIC_EXPORT_INTERVAL: "15000"

# Clients of OpenSearch and RabbitMQ trust the development CA (certs volume, ca/ folder).
x-ca-volume: &ca-volume
  type: volume
  source: certs
  target: /run/certs
  read_only: true
  volume: { subpath: ca }

# Outgoing webhooks (module 14). Development only: plain HTTP is allowed and the Compose network
# may be reached, so webhooks can go to the local webhook-receiver. Installs leave both off and
# list only the internal networks their receivers are on.
x-integrations-env: &integrations-env
  Integrations__Webhooks__AllowInsecureHttp: "true"
  Integrations__Webhooks__AllowedPrivateNetworks__0: 172.16.0.0/12
  Integrations__Webhooks__AllowedPrivateNetworks__1: 192.168.0.0/16
  Integrations__Webhooks__AllowedPrivateNetworks__2: 10.0.0.0/8

# AI providers (module 9). Development only: plain HTTP is allowed and the Compose network may be
# reached, so Settings → AI can use the local ai-mock (http://ai-mock:8097/v1). Installs leave
# both off and list only the internal networks a self-hosted model is on.
x-ai-env: &ai-env
  Ai__AllowInsecureHttp: "true"
  Ai__AllowedPrivateNetworks__0: 172.16.0.0/12
  Ai__AllowedPrivateNetworks__1: 192.168.0.0/16
  Ai__AllowedPrivateNetworks__2: 10.0.0.0/8

# Payments (module 15, task E8): like AI, development lets gateways on the Compose network over
# plain HTTP be reached, so Settings → Payments and the demo can use the local payment-mock
# (http://payment-mock:8098). Installs leave both off; the gateway is the customer's own HTTPS
# service. PublicUrl is the address gateways send the payer back to and notify.
x-payments-env: &payments-env
  Payments__AllowInsecureHttp: "true"
  Payments__AllowedPrivateNetworks__0: 172.16.0.0/12
  Payments__AllowedPrivateNetworks__1: 192.168.0.0/16
  Payments__AllowedPrivateNetworks__2: 10.0.0.0/8
  Payments__PublicUrl: http://localhost:${WEB_PORT:-3000}/

# Notifications (module 10, task B5; product owner decision 2026-11-24): one mail server for the
# whole installation, set by the operator. Development sends to Mailpit (http://localhost:8025)
# without TLS; installs set their own relay, port, user and password (from .env, never committed)
# and Security (Auto, StartTls or SslOnConnect). WebUrl is the address in the emails' links.
x-notifications-env: &notifications-env
  Notifications__WebUrl: http://localhost:${WEB_PORT:-3000}/
  Notifications__Smtp__Host: ${ZELVO_SMTP_HOST:-mailpit}
  Notifications__Smtp__Port: ${ZELVO_SMTP_PORT:-1025}
  Notifications__Smtp__Security: ${ZELVO_SMTP_SECURITY:-None}
  Notifications__Smtp__User: ${ZELVO_SMTP_USER:-}
  Notifications__Smtp__Password: ${ZELVO_SMTP_PASSWORD:-}
  Notifications__Smtp__From: ${ZELVO_SMTP_FROM:-no-reply@zelvo.test}

# Branding (F1): the installation's public host that custom domains point to, the secret of the
# reverse proxy's TLS questions, and what SPF must allow for the installation's mail server.
x-branding-env: &branding-env
  Branding__PublicHost: ${ZELVO_PUBLIC_HOST:-localhost}
  Branding__TlsToken: ${ZELVO_TLS_TOKEN:?set in .env}
  Branding__SpfInclude: ${ZELVO_SPF_INCLUDE:-}

# Email and live chat (E2): links in replies and the mailbox sign-in address use the web app's
# address. Development: mail servers in the Compose network (the GreenMail test server) may be
# reached; installations list only their own internal mail networks.
x-channels-env: &channels-env
  Channels__WebUrl: http://localhost:${WEB_PORT:-3000}/
  # Task E3: the public address providers send incoming messages to (through the proxy's /hooks/).
  Channels__PublicUrl: https://${ZELVO_PUBLIC_HOST:-localhost}/
  Channels__Network__AllowedPrivateNetworks__0: 172.16.0.0/12
  Channels__Network__AllowedPrivateNetworks__1: 192.168.0.0/16
  Channels__Network__AllowedPrivateNetworks__2: 10.0.0.0/8
  # Task E7: directories, CRMs and REST APIs a development installation may reach on internal networks.
  Connectors__Network__AllowedPrivateNetworks__0: 172.16.0.0/12
  Connectors__Network__AllowedPrivateNetworks__1: 192.168.0.0/16
  Connectors__Network__AllowedPrivateNetworks__2: 10.0.0.0/8

# Licensing (task F3, docs/architecture/licensing.md): the fingerprint's server part is the host's
# machine id, mounted read-only, and its domain is the installation's public host. Development
# builds use the development license until a license is imported; Licensing__DevelopmentLicense:
# "false" tries activation, with a key of your own from the signing tool in Licensing__DevelopmentKeys.
x-licensing-env: &licensing-env
  Licensing__Domain: ${ZELVO_PUBLIC_HOST:-localhost}
  Licensing__DevelopmentLicense: ${ZELVO_DEVELOPMENT_LICENSE:-true}
  Licensing__DevelopmentKeys__0__Id: ${ZELVO_DEV_SIGNING_KEY_ID:-}
  Licensing__DevelopmentKeys__0__PublicKey: ${ZELVO_DEV_SIGNING_PUBLIC_KEY:-}

# Installs set ZELVO_MACHINE_ID_FILE=/etc/machine-id (the hardened Compose file of task F6 does);
# development leaves it empty, because Docker Desktop hosts have no /etc/machine-id.
x-machine-id: &machine-id
  type: bind
  source: ${ZELVO_MACHINE_ID_FILE:-/dev/null}
  target: /etc/machine-id
  read_only: true
  bind: { create_host_path: false }

# Updates (F4, docs/architecture/updates.md): packages, the inbox for packages carried in on USB,
# backups and the maintenance page's status, shared by the API, the updater and the proxy.
x-updates-volume: &updates-volume
  type: volume
  source: updates
  target: /var/lib/zelvo/updates

x-secrets-env: &secrets-env
  Secrets__Provider: File
  Secrets__File__Path: /run/secrets/zelvo-master-key

services:
  # One-off: development CA and TLS certificates for OpenSearch and RabbitMQ (A5), kept in the
  # "certs" volume and renewed before they expire. Uses the database image for its openssl.
  certs:
    image: pgvector/pgvector:pg17
    entrypoint: ["sh", "/generate-certs.sh"]
    user: root
    restart: "no"
    volumes:
      - ./security/generate-certs.sh:/generate-certs.sh:ro
      - certs:/certs

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      ZELVO_APP_DB_USER: ${ZELVO_APP_DB_USER:?set in .env}
      ZELVO_APP_DB_PASSWORD: ${ZELVO_APP_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cache: Valkey (BSD licence, Redis-protocol compatible). The service keeps the name "redis"
  # because clients speak the Redis protocol; see the decisions log in CLAUDE.md.
  redis:
    <<: *restart
    image: valkey/valkey:9.2-alpine
    command: ["sh", "-c", "exec valkey-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      VALKEYCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    <<: *restart
    image: rabbitmq:4.4-management-alpine
    # TLS 1.3 only, no plain listener; users and the "zelvo" virtual host come from
    # secrets/rabbitmq-definitions.json (scripts/dev-up.sh, from .env). See security/rabbitmq.
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./security/rabbitmq/10-zelvo.conf:/etc/rabbitmq/conf.d/10-zelvo.conf:ro
      - ./secrets/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume: { subpath: rabbitmq }
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    depends_on:
      certs: { condition: service_completed_successfully }

  # OpenSearch with the ICU analysis plugin (Arabic and English analysers): deploy/opensearch.
  opensearch:
    <<: *restart
    build:
      context: ../opensearch
    image: zelvo/opensearch:${ZELVO_VERSION:-dev}
    # Security plugin on (A5): HTTPS and TLS between nodes with the development certificates,
    # users admin, zelvo-api (reads) and zelvo-worker (writes zelvo-* indices). See security/opensearch.
    entrypoint: ["/zelvo-security/start.sh"]
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?set in .env}
      OPENSEARCH_API_PASSWORD: ${OPENSEARCH_API_PASSWORD:?set in .env}
      OPENSEARCH_WORKER_PASSWORD: ${OPENSEARCH_WORKER_PASSWORD:?set in .env}
      plugins.security.ssl.http.enabled: "true"
      plugins.security.ssl.http.pemcert_filepath: certs/node.crt
      plugins.security.ssl.http.pemkey_filepath: certs/node.key
      plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt
      plugins.security.ssl.transport.pemcert_filepath: certs/node.crt
      plugins.security.ssl.transport.pemkey_filepath: certs/node.key
      plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
      plugins.security.ssl.transport.enforce_hostname_verification: "false"
      plugins.security.ssl.http.enabled_protocols: TLSv1.3
      plugins.security.ssl.transport.enabled_protocols: TLSv1.3
      plugins.security.nodes_dn: CN=opensearch,O=Zelvo Development
      plugins.security.authcz.admin_dn: CN=zelvo-opensearch-admin,O=Zelvo Development
      plugins.security.allow_default_init_securityindex: "true"
      plugins.security.audit.type: log4j
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Development only: disk limits in free space rather than percent used, so a large but
      # nearly full disk does not stop OpenSearch from creating tenants' indices.
      cluster.routing.allocation.disk.watermark.low: 2gb
      cluster.routing.allocation.disk.watermark.high: 1gb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./security/opensearch:/zelvo-security:ro
      - type: volume
        source: certs
        target: /usr/share/opensearch/config/certs
        read_only: true
        volume: { subpath: opensearch }
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert config/certs/ca.crt -u \"admin:$${OPENSEARCH_ADMIN_PASSWORD}\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    depends_on:
      certs: { condition: service_completed_successfully }

  # Keycloak with Zelvo's extension (email one-time code) and theme: src/keycloak.
  # One realm per tenant, created by the migrate service; no realm is imported here.
  keycloak:
    <<: *restart
    build:
      context: ../../src/keycloak
    image: zelvo/keycloak:${ZELVO_VERSION:-dev}
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Browsers reach Keycloak here, so token issuers use this address; Zelvo's servers reach
      # it as http://keycloak:8080 (back channel).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Metrics for Prometheus on the management port, traces to the collector (A5).
      KC_METRICS_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SERVICE_NAME: keycloak
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; ask the management port with bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Development mail catcher: sign-in codes and other emails appear at http://localhost:8025.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development mail server for email-to-ticket (E2), GreenMail (Apache 2.0), not for installations:
  # IMAP on greenmail:3143 and SMTP on greenmail:3025 without TLS, any user name and password
  # accepted. Add a mailbox in Settings → Mailboxes with provider IMAP, both hosts "greenmail",
  # security "No TLS", and send it mail from the host with any SMTP client on localhost:3025.
  greenmail:
    <<: *restart
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-3025}:3025"

  # Development stand-in for UAE PASS (GOV-1): http://localhost:8095. Choose "Mock" as the UAE PASS
  # environment in Settings → UAE PASS, with client ID zelvo-mock and UAEPASS_MOCK_CLIENT_SECRET.
  # Plain Node.js without packages, so the official image runs it as is.
  uaepass-mock:
    <<: *restart
    image: node:24-alpine
    command: ["node", "/app/server.mjs"]
    user: node
    working_dir: /app
    environment:
      PORT: "8095"
      UAEPASS_MOCK_CLIENT_ID: zelvo-mock
      UAEPASS_MOCK_CLIENT_SECRET: ${UAEPASS_MOCK_CLIENT_SECRET:?set in .env}
    volumes:
      - ./uaepass-mock:/app:ro
    ports:
      - "127.0.0.1:${UAEPASS_MOCK_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8095/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development only: a webhook receiver for trying Settings → Integrations → Webhooks. Use
  # http://webhook-receiver:8096/hook as the receiver URL; http://localhost:8096/received lists what
  # it got (newest first), and /hook?status=503 answers with that status.
  webhook-receiver:
    <<: *restart
    image: node:26-alpine
    command: ["node", "/app/server.mjs"]
    user: node
    working_dir: /app
    environment:
      PORT: "8096"
    volumes:
      - ./webhook-receiver:/app:ro
    ports:
      - "127.0.0.1:${WEBHOOK_RECEIVER_PORT:-8096}:8096"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development only: a payment gateway sandbox for Settings → Payments and the demo (task E8). Its
  # payer page is http://localhost:8098/pay/…; it notifies Zelvo through the web app on the
  # Compose network. No real money and no card data.
  payment-mock:
    <<: *restart
    image: node:24-alpine
    command: ["node", "/app/server.mjs"]
    user: node
    working_dir: /app
    environment:
      PORT: "8098"
      PUBLIC_ORIGIN: http://localhost:${PAYMENT_MOCK_PORT:-8098}
      CALLBACK_ORIGIN: http://web:3000
    volumes:
      - ./payment-mock:/app:ro
    ports:
      - "127.0.0.1:${PAYMENT_MOCK_PORT:-8098}:8098"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8098/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development only: an OpenAI-compatible AI provider for trying Settings → AI without a real
  # provider or key. Use http://ai-mock:8097/v1 as the endpoint of an "OpenAI-compatible" provider;
  # http://localhost:8097/received lists what it got (newest first).
  ai-mock:
    <<: *restart
    image: node:24-alpine
    command: ["node", "/app/server.mjs"]
    user: node
    working_dir: /app
    environment:
      PORT: "8097"
    volumes:
      - ./ai-mock:/app:ro
    ports:
      - "127.0.0.1:${AI_MOCK_PORT:-8097}:8097"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8097/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: applies database migrations as the database owner, creates the default tenant and
  # its built-in roles, sets up each tenant's Keycloak realm and the development users, then
  # exits. The API starts only after it succeeds.
  migrate:
    build:
      context: ../..
      dockerfile: src/api/Zelvo.Api/Dockerfile
    image: zelvo/api:${ZELVO_VERSION:-dev}
    command: ["migrate"]
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__PostgresOwner: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_SUPERUSER};Password=${POSTGRES_SUPERUSER_PASSWORD}
      Tenancy__Bootstrap__Slug: ${ZELVO_DEFAULT_TENANT:-default}
      Tenancy__Bootstrap__NameEn: ${ZELVO_DEFAULT_TENANT_NAME_EN:-Zelvo}
      Tenancy__Bootstrap__NameAr: ${ZELVO_DEFAULT_TENANT_NAME_AR:-زيلفو}
      <<: &identity
        Identity__PublicUrl: http://localhost:${KEYCLOAK_PORT:-8180}
        Identity__InternalUrl: http://keycloak:8080
        Identity__ProvisionerClientSecret: ${KEYCLOAK_PROVISIONER_SECRET:?set in .env}
        # Development only: offers "Mock" as a UAE PASS environment. Browsers open the first
        # address; Keycloak calls the second. Never set in an install.
        Identity__UaePass__Mock__PublicUrl: http://localhost:${UAEPASS_MOCK_PORT:-8095}
        Identity__UaePass__Mock__InternalUrl: http://uaepass-mock:8095
      Identity__Provisioning__AdminUser: ${KEYCLOAK_ADMIN_USER:?set in .env}
      Identity__Provisioning__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      Identity__Provisioning__WebUrl: http://localhost:${WEB_PORT:-3000}
      Identity__Provisioning__WebClientSecret: ${ZELVO_WEB_CLIENT_SECRET:?set in .env}
      Identity__Provisioning__Smtp__Host: mailpit
      Identity__Provisioning__Smtp__Port: "1025"
      Identity__Provisioning__Smtp__From: no-reply@zelvo.test
      # Development only: one user per persona (requester@zelvo.test, agent@, lead@, approver@,
      # admin@, executive@) with this password.
      Identity__Provisioning__DevUsersPassword: ${ZELVO_DEV_USERS_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  api:
    <<: *restart
    image: zelvo/api:${ZELVO_VERSION:-dev}
    pull_policy: never
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${ZELVO_APP_DB_USER};Password=${ZELVO_APP_DB_PASSWORD}
      Tenancy__DefaultTenant: ${ZELVO_DEFAULT_TENANT:-default}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      ConnectionStrings__RabbitMq: amqps://zelvo-api:${RABBITMQ_API_PASSWORD}@rabbitmq:5671/zelvo
      RabbitMq__CaFile: /run/certs/ca.crt
      Services__OpenSearch: https://opensearch:9200/
      Search__Username: zelvo-api
      Search__Password: ${OPENSEARCH_API_PASSWORD}
      Search__CaFile: /run/certs/ca.crt
      Services__KeycloakHealth: http://keycloak:9000/health/ready
      <<: [*identity, *secrets-env, *telemetry-env, *integrations-env, *ai-env, *notifications-env, *channels-env, *branding-env, *payments-env, *licensing-env]
      # Development: everything in the Compose network (the web app's server) may forward client
      # addresses. Installs list their proxies' exact addresses.
      Network__TrustedProxies__0: 172.16.0.0/12
      Network__TrustedProxies__1: 192.168.0.0/16
      Network__TrustedProxies__2: 10.0.0.0/8
      # Development: every local browser reaches the stack from one address (the Docker gateway),
      # so visitors share one limit; installs keep the default of 120 a minute per address.
      RateLimiting__VisitorPermits: ${ZELVO_RATE_LIMIT_VISITORS:-1200}
      # New attachments wait for the worker's malware scan unless scanning is off (B1).
      AttachmentScanning__Enabled: ${ZELVO_ATTACHMENT_SCANNING:-true}
    secrets: [zelvo-master-key]
    volumes: [*ca-volume, *machine-id, *updates-volume]
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      # The image has no curl; ask the liveness endpoint with bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *restart
    build:
      context: ../..
      dockerfile: src/worker/Zelvo.Worker/Dockerfile
    image: zelvo/worker:${ZELVO_VERSION:-dev}
    environment:
      DOTNET_ENVIRONMENT: Development
      Worker__HeartbeatFile: /tmp/zelvo-worker.heartbeat
      # Search indexing (A4): reads the search outbox as the application role (row-level
      # security applies), relays it through RabbitMQ and writes to OpenSearch.
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${ZELVO_APP_DB_USER};Password=${ZELVO_APP_DB_PASSWORD}
      ConnectionStrings__RabbitMq: amqps://zelvo-worker:${RABBITMQ_WORKER_PASSWORD}@rabbitmq:5671/zelvo
      RabbitMq__CaFile: /run/certs/ca.crt
      Services__OpenSearch: https://opensearch:9200/
      Search__Username: zelvo-worker
      Search__Password: ${OPENSEARCH_WORKER_PASSWORD}
      Search__CaFile: /run/certs/ca.crt
      # Tickets (B1): malware scanning of attachments with ClamAV (on unless set to false), and
      # closing resolved tickets after the tenant's auto-close period.
      AttachmentScanning__Enabled: ${ZELVO_ATTACHMENT_SCANNING:-true}
      AttachmentScanning__Host: clamav
      AttachmentScanning__Port: "3310"
      <<: [*secrets-env, *telemetry-env, *integrations-env, *ai-env, *notifications-env, *channels-env, *licensing-env]
    secrets: [zelvo-master-key]
    volumes: [*ca-volume, *machine-id]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      # Not "healthy": ClamAV can take minutes to load its definitions, and files simply wait.
      clamav: { condition: service_started }
      # Notifications (B5): emails wait and are retried while the mail server is away.
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/zelvo-worker.heartbeat -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Malware scanning of attachments (B1, product owner decision 2026-11-22): the official ClamAV
  # image, unmodified (GPL-2.0). It ships with malware definitions and keeps them up to date with
  # freshclam when it can reach the internet. Offline installations set CLAMAV_NO_FRESHCLAMD=true
  # and import definition files with scripts/clamav-import-definitions.sh. Needs about 1-1.5 GB
  # of memory, briefly about twice that while it loads new definitions.
  clamav:
    <<: *restart
    image: clamav/clamav:1.5.5
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
      # Room for the largest attachment a tenant can allow (100 MB).
      CLAMD_CONF_StreamMaxLength: 105M
      CLAMD_CONF_MaxFileSize: 105M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamav-db:/var/lib/clamav
    # The image's own health check (clamdcheck.sh) applies; only the worker connects, inside the network.

  web:
    <<: *restart
    build:
      context: ../../src/web
    image: zelvo/web:${ZELVO_VERSION:-dev}
    environment:
      API_INTERNAL_URL: http://api:8080
      APP_URL: http://localhost:${WEB_PORT:-3000}
      ZELVO_TENANT: ${ZELVO_DEFAULT_TENANT:-default}
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      ZELVO_WEB_CLIENT_SECRET: ${ZELVO_WEB_CLIENT_SECRET:?set in .env}
      SESSION_STORE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Traces of the web app's server (pages, sign-in, API proxy) to the collector (A5).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Reverse proxies in front of the web app whose X-Forwarded-For is trusted: the Caddy proxy (F1).
      TRUSTED_PROXY_HOPS: "${ZELVO_TRUSTED_PROXY_HOPS:-0}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Updater (F4): installs the update packages administrators import and schedule in Settings →
  # Updates: checks the package's signature again, loads its images, stops Zelvo's services (the
  # proxy shows the maintenance page), backs up the databases and this configuration, switches
  # ZELVO_VERSION in .env, runs migrate, starts the services and rolls back by itself when a step
  # fails. It needs the Docker socket (root on the host), so it listens on no port and acts only on
  # installs recorded in the database for packages signed by Zelvo.
  updater:
    <<: *restart
    build:
      context: ../..
      dockerfile: src/updater/Zelvo.Updater/Dockerfile
    image: zelvo/updater:${ZELVO_VERSION:-dev}
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${ZELVO_APP_DB_USER};Password=${ZELVO_APP_DB_PASSWORD}
      ZELVO_COMPOSE_DIR: ${ZELVO_COMPOSE_DIR:?run scripts/dev-up.sh, which sets it in .env}
      Updater__ComposeDirectory: ${ZELVO_COMPOSE_DIR}
      Updater__ComposeProjectName: ${COMPOSE_PROJECT_NAME:-zelvo}
      Updater__ComposeFileList: ${COMPOSE_FILE:-compose.yaml}
      Updater__DatabaseList: ${POSTGRES_DB},keycloak
      <<: [*telemetry-env, *licensing-env]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ZELVO_COMPOSE_DIR}:${ZELVO_COMPOSE_DIR}
      - *updates-volume
      - *machine-id
    depends_on:
      postgres: { condition: service_healthy }
      # The API's image sets up the updates volume's folders and their owner.
      api: { condition: service_healthy }

  # Reverse proxy (F1): HTTPS for the installation's address and tenants' custom domains, with
  # automatic certificates (ACME) or the ones tenants uploaded. Caddy (Apache-2.0), unmodified.
  # Development: https://localhost:8443 with Caddy's own certificate authority.
  proxy:
    <<: *restart
    image: caddy:2.11.9-alpine
    environment:
      ZELVO_PUBLIC_HOST: ${ZELVO_PUBLIC_HOST:-localhost}
      ZELVO_PUBLIC_TLS: ${ZELVO_PUBLIC_TLS:-internal}
      ZELVO_TLS_TOKEN: ${ZELVO_TLS_TOKEN:?set in .env}
      ZELVO_ACME_EMAIL: ${ZELVO_ACME_EMAIL:-admin@localhost}
      ZELVO_ACME_CA: ${ZELVO_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      # F4: the maintenance page while an update is installed, and the updater's status for it.
      - ./caddy/maintenance:/srv/maintenance:ro
      - { type: volume, source: updates, target: /srv/zelvo-status, read_only: true, volume: { subpath: status } }
    ports:
      - "${ZELVO_HTTP_PORT:-8088}:80"
      - "${ZELVO_HTTPS_PORT:-8443}:443"
    depends_on:
      web: { condition: service_healthy }

  # Observability (A5, docs/architecture/observability.md). Operator tools, English only.
  # The collector receives OTLP from Zelvo's services and fans it out.
  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      prometheus: { condition: service_healthy }
      tempo: { condition: service_started }
      loki: { condition: service_started }

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Traces, kept 7 days. The image has no shell, so Compose cannot check its health.
  tempo:
    <<: *restart
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  # Logs, kept 15 days. The image has no shell, so Compose cannot check its health.
  loki:
    <<: *restart
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  # Dashboards and alerts: http://localhost:3001 (GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD).
  grafana:
    <<: *restart
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Works offline: no calls home, no plugin downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  opensearch-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
  certs:
  clamav-db:
  updates:
  caddy-data:

secrets:
  zelvo-master-key:
    file: ./secrets/master.key
