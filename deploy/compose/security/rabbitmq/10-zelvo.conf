# RabbitMQ security (A5): no plain AMQP listener; clients use TLS 1.3 on 5671 and sign in with
# their own user (definitions.json, created by scripts/dev-up.sh from .env). The management UI and
# the Prometheus endpoint stay inside the Compose network (the UI is published on 127.0.0.1 only).
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/server.crt
ssl_options.keyfile = /certs/server.key
ssl_options.versions.1 = tlsv1.3
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

loopback_users.guest = true
load_definitions = /etc/rabbitmq/definitions.json
