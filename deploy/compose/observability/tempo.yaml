# Tempo (A5): traces of Zelvo's services, received over OTLP from the collector. Single process,
# files on its volume; kept 7 days.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }

# Retention: blocks older than 7 days are deleted by the backend worker.
backend_worker:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }

usage_report:
  reporting_enabled: false
