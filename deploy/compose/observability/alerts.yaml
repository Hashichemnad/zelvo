# Alert rules shown in Grafana (Alerting → Alert rules). Thresholds follow the non-functional
# requirements: API under 200 ms at the 95th percentile.
groups:
  - name: zelvo
    rules:
      - alert: ZelvoApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="zelvo/zelvo-api", http_route=~"/api/.*"}[5m]))) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 200 ms for 10 minutes"
      - alert: ZelvoApiErrors
        expr: sum(rate(http_server_request_duration_seconds_count{job="zelvo/zelvo-api", http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="zelvo/zelvo-api"}[5m])) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 2% of API requests fail with a server error"
      - alert: ZelvoRateLimitCacheDown
        expr: sum(rate(zelvo_rate_limit_store_errors_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Rate limits are not applied: the cache (Valkey) is unavailable"
      - alert: ZelvoSearchRetrying
        expr: sum(rate(zelvo_search_retried_total[10m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Search indexing keeps retrying (OpenSearch or PostgreSQL unavailable)"
