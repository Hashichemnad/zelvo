{{- $fullname := include "zelvo.fullname" . -}}
# Keycloak in production mode at https://<publicHost>/auth; replicas share sessions through the
# database (Keycloak's default jdbc-ping cache stack). Its admin console is not published by the
# proxy: kubectl port-forward svc/{{ $fullname }}-keycloak 8180:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-keycloak
  labels:
    {{- include "zelvo.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels: {{- include "zelvo.selector" (dict "root" . "name" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zelvo.labels" . | nindent 8 }}
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "zelvo.podSecurity" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 0
      containers:
        - name: keycloak
          image: {{ include "zelvo.image" (dict "root" . "name" "keycloak") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start"]
          securityContext:
            allowPrivilegeEscalation: false
            # Keycloak builds its optimised configuration into its own folder on start.
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.keycloakDatabase }}?sslmode={{ include "zelvo.jdbcSslMode" . }}" }
            - { name: KC_DB_USERNAME, value: {{ .Values.postgres.keycloakUser | quote }} }
            {{- include "zelvo.secretEnv" (dict "root" . "env" "KC_DB_PASSWORD" "key" "keycloakDbPassword") | nindent 12 }}
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            {{- include "zelvo.secretEnv" (dict "root" . "env" "KC_BOOTSTRAP_ADMIN_PASSWORD" "key" "keycloakAdminPassword") | nindent 12 }}
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HTTP_PORT, value: "8080" }
            - { name: KC_HTTP_RELATIVE_PATH, value: /auth }
            - { name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: / }
            - { name: KC_HOSTNAME, value: "https://{{ .Values.publicHost }}/auth" }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=70" }
            {{- if .Values.telemetry.otlpEndpoint }}
            - { name: KC_TRACING_ENABLED, value: "true" }
            - { name: KC_TRACING_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }} }
            - { name: KC_TRACING_SERVICE_NAME, value: keycloak }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe: { httpGet: { path: /health/started, port: management }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /health/ready, port: management }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: management }, periodSeconds: 20 }
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-keycloak
  labels: {{- include "zelvo.labels" . | nindent 4 }}
spec:
  selector: {{- include "zelvo.selector" (dict "root" . "name" "keycloak") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 9000, targetPort: management }
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-keycloak
  labels: {{- include "zelvo.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "zelvo.selector" (dict "root" . "name" "keycloak") | nindent 6 }}
{{- end }}
