# pgBackRest for Zelvo (task F6). One stanza, "zelvo", for the whole PostgreSQL cluster (the Zelvo
# and Keycloak databases). The repository is /var/lib/pgbackrest (its own volume: put it on
# another disk or mount network storage), or S3-compatible storage with the PGBACKREST_REPO1_*
# environment variables (pgBackRest reads any option from PGBACKREST_<OPTION>).
[global]
repo1-path=/var/lib/pgbackrest
# Daily backups kept 35 days: the full backups needed to restore any moment of the last 35 days.
repo1-retention-full-type=time
repo1-retention-full=35
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
start-fast=y
process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
spool-path=/var/spool/pgbackrest
archive-async=y
archive-push-queue-max=4GiB

[zelvo]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
