zelvoEmailCodeBody=رمز تسجيل الدخول إلى {2} هو {0}.\n\nيُستخدم الرمز مرة واحدة وتنتهي صلاحيته خلال {1} دقائق. إذا لم تطلب هذا الرمز، يمكنك تجاهل هذه الرسالة، فلا يمكن لأحد تسجيل الدخول دون الرمز.
zelvoEmailCodeBodyHtml=<p>رمز تسجيل الدخول إلى {2} هو:</p><p style="font-size:24px;font-weight:bold;letter-spacing:4px" dir="ltr">{0}</p><p>يُستخدم الرمز مرة واحدة وتنتهي صلاحيته خلال {1} دقائق. إذا لم تطلب هذا الرمز، يمكنك تجاهل هذه الرسالة، فلا يمكن لأحد تسجيل الدخول دون الرمز.</p>
