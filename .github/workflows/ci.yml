name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Zelvo.slnx
      - name: Build (warnings are errors)
        run: dotnet build Zelvo.slnx -c Release --no-restore
      - name: Unit and integration tests (PostgreSQL in Docker)
        run: dotnet test --solution Zelvo.slnx -c Release --no-build
      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet list Zelvo.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  keycloak:
    name: Keycloak extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: src/keycloak/pom.xml
      - name: Build and test (warnings are errors)
        run: mvn -B verify

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail on high or critical vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Stack starts and end-to-end tests pass
    runs-on: ubuntu-latest
    needs: [backend, frontend, keycloak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the whole stack with one command
        run: make up
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: tests/e2e
        run: npx playwright test
      - name: Service logs on failure
        if: failure()
        run: cd deploy/compose && docker compose ps && docker compose logs --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: make reset

  images:
    name: Container scan and SBOM (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [backend, frontend, keycloak]
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, context: ., dockerfile: src/api/Zelvo.Api/Dockerfile }
          - { name: worker, context: ., dockerfile: src/worker/Zelvo.Worker/Dockerfile }
          - { name: web, context: src/web, dockerfile: src/web/Dockerfile }
          - { name: keycloak, context: src/keycloak, dockerfile: src/keycloak/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t zelvo/${{ matrix.image.name }}:ci -f ${{ matrix.image.dockerfile }} ${{ matrix.image.context }}
      - name: Software bill of materials (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: zelvo/${{ matrix.image.name }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image.name }}.cdx.json
          artifact-name: sbom-${{ matrix.image.name }}.cdx.json
          upload-artifact-retention: 30
      - name: Scan image for vulnerabilities (fail on fixable critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: zelvo/${{ matrix.image.name }}:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
