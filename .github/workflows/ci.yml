name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Zelvo.slnx
      - name: Build (warnings are errors)
        run: dotnet build Zelvo.slnx -c Release --no-restore
      - name: OpenSearch image with the ICU plugin (search integration tests use it)
        run: docker build -t zelvo/opensearch:dev deploy/opensearch
      - name: Unit and integration tests (PostgreSQL, RabbitMQ and OpenSearch in Docker)
        run: dotnet test --solution Zelvo.slnx -c Release --no-build
      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet list Zelvo.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  keycloak:
    name: Keycloak extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: src/keycloak/pom.xml
      - name: Keycloak image and libraries are the same version
        working-directory: .
        run: scripts/check-keycloak-version.sh
      - name: Build and test (warnings are errors)
        run: mvn -B verify

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail on high or critical vulnerabilities in runtime dependencies (approved exceptions in audit-exceptions.json)
        run: node scripts/audit.mjs

  load-scripts:
    # Task F7: the load tests run on a dedicated test server (tests/load/README.md); CI only checks
    # that the scripts load and the provisioning spec type-checks.
    name: Load-test scripts load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: k6 scripts load with sample credentials
        run: |
          for script in agents api-latency; do
            docker run --rm -v "$PWD/tests/load:/load" -w /load grafana/k6:2.4.0 inspect -e LOAD_CREDENTIALS=/load/k6/fixtures/sample-load.json "k6/$script.js" > /dev/null
          done
      - name: Live-connection script parses
        run: node --check tests/load/live/live-connections.mjs
      - name: End-to-end and provisioning specs type-check
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx tsc -p tsconfig.json

  e2e:
    name: Stack starts and end-to-end tests pass
    runs-on: ubuntu-latest
    needs: [backend, frontend, keycloak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the whole stack with one command
        run: make up
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: tests/e2e
        run: npx playwright test
      - name: Service logs on failure
        if: failure()
        run: cd deploy/compose && docker compose ps && docker compose logs --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: make reset

  e2e-demo:
    name: Demo installation starts and demo mode end-to-end tests pass
    runs-on: ubuntu-latest
    needs: [backend, frontend, keycloak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the demo installation with one command
        run: make demo
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Demo mode end-to-end tests, then the WCAG 2.2 AA audit of every page (task F7)
        working-directory: tests/e2e
        env:
          E2E_DEMO: "1"
        run: npx playwright test
      - name: Service logs on failure
        if: failure()
        run: cd deploy/compose && COMPOSE_PROJECT_NAME=zelvo-demo COMPOSE_FILE=compose.yaml:compose.demo.yaml docker compose logs --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-demo
          path: |
            tests/e2e/playwright-report
            tests/e2e/accessibility-report
          retention-days: 7
      - name: Stop the demo
        if: always()
        run: make demo-wipe

  release-build:
    name: Release build checks (obfuscation, Compose, Helm, scripts)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Obfuscated API and worker behave like the plain ones (OpenAPI, startup)
        run: scripts/check-obfuscation.sh
      - name: Hardened Compose uses the development image versions and is valid
        run: |
          scripts/check-compose-images.sh
          cd deploy/compose
          sed 's/=change-me/=ci-value/' .env.production.example > /tmp/ci-production.env
          for setting in ZELVO_PUBLIC_HOST=zelvo.test ZELVO_ACME_EMAIL=ops@zelvo.test ZELVO_VERSION=ci ZELVO_COMPOSE_DIR=/opt/zelvo \
              ZELVO_DEFAULT_TENANT_NAME_EN=Zelvo ZELVO_DEFAULT_TENANT_NAME_AR=زيلفو ZELVO_SMTP_HOST=mail.zelvo.test ZELVO_SMTP_FROM=no-reply@zelvo.test; do
            sed -i "s#^${setting%%=*}=.*#${setting}#" /tmp/ci-production.env
          done
          docker compose -f compose.production.yaml --env-file /tmp/ci-production.env --profile observability config --quiet
      - name: Helm chart lints and renders
        run: |
          helm lint deploy/helm/zelvo --strict -f deploy/helm/zelvo/ci/test-values.yaml
          helm template zelvo deploy/helm/zelvo -f deploy/helm/zelvo/ci/test-values.yaml > /tmp/zelvo-chart.yaml
          deploy/helm/zelvo/ci/check-rendered.sh /tmp/zelvo-chart.yaml
      - name: Shell scripts
        # SC1090/SC1091: the scripts source the installation's own .env on purpose.
        run: shellcheck --severity=warning --exclude=SC1090,SC1091 scripts/*.sh scripts/*/*.sh build/obfuscar/*.sh deploy/postgres/*.sh deploy/compose/backup/*.sh deploy/helm/zelvo/ci/*.sh deploy/helm/zelvo/examples/*.sh

  production-install:
    name: Hardened install from a bundle, backup and restore drill
    runs-on: ubuntu-latest
    needs: [backend, frontend, keycloak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build a test bundle (obfuscated images, manifest signed with a throwaway key)
        run: scripts/release/test-bundle.sh 0.0.1 /tmp/bundle
      - name: Install it like a customer
        run: |
          mkdir -p /tmp/unpacked && tar -xf /tmp/bundle/zelvo-0.0.1.tar -C /tmp/unpacked
          # The first run makes .env and stops for the required settings.
          sudo /tmp/unpacked/zelvo-0.0.1/install.sh --no-start || test $? -eq 3
          # Staging: the test bundle is a development build (no vendor key in CI), which refuses
          # to run in Production by design; release builds never use the development license.
          for setting in ZELVO_ENVIRONMENT=Staging ZELVO_PUBLIC_HOST=localhost ZELVO_PUBLIC_TLS=internal ZELVO_ACME_EMAIL=ops@zelvo.test \
              ZELVO_DEFAULT_TENANT_NAME_EN=Zelvo ZELVO_DEFAULT_TENANT_NAME_AR=زيلفو ZELVO_SMTP_HOST=mail.zelvo.test ZELVO_SMTP_FROM=no-reply@zelvo.test; do
            sudo sed -i "s#^${setting%%=*}=.*#${setting}#" /opt/zelvo/.env
          done
          sudo /tmp/unpacked/zelvo-0.0.1/install.sh
      - name: Only the proxy is reachable from outside; sign-in through /auth, no admin console
        run: |
          ports=$(sudo docker ps --filter label=com.docker.compose.project=zelvo --format '{{.Ports}}' \
            | grep -oE '(0\.0\.0\.0|\[::\]):[0-9]+->' | sed -E 's/.*:([0-9]+)->/\1/' | LC_ALL=C sort -u | tr '\n' ' ')
          echo "Ports published beyond this server: $ports"
          [[ "$ports" == "443 80 " ]]
          curl -fsk https://localhost/healthz > /dev/null
          curl -fsk https://localhost/auth/realms/zelvo-default/.well-known/openid-configuration | grep -q '"issuer":"https://localhost/auth/realms/zelvo-default"'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/auth/admin/master/console/)" = 404
          sudo docker compose --project-directory /opt/zelvo exec -T web wget -qO- http://api:8080/api/v1/system/info | grep -q '"activated":true'
      - name: Backup and point-in-time restore drill
        run: sudo scripts/backup/drill.sh /opt/zelvo
      - name: Service logs on failure
        if: failure()
        run: sudo docker compose --project-directory /opt/zelvo logs --tail 200

  images:
    name: Container scan and SBOM (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [backend, frontend, keycloak]
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, context: ., dockerfile: src/api/Zelvo.Api/Dockerfile }
          - { name: worker, context: ., dockerfile: src/worker/Zelvo.Worker/Dockerfile }
          - { name: web, context: src/web, dockerfile: src/web/Dockerfile }
          - { name: keycloak, context: src/keycloak, dockerfile: src/keycloak/Dockerfile }
          - { name: opensearch, context: deploy/opensearch, dockerfile: deploy/opensearch/Dockerfile }
          - { name: updater, context: ., dockerfile: src/updater/Zelvo.Updater/Dockerfile }
          - { name: postgres, context: deploy/postgres, dockerfile: deploy/postgres/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t zelvo/${{ matrix.image.name }}:ci -f ${{ matrix.image.dockerfile }} ${{ matrix.image.context }}
      - name: Software bill of materials (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: zelvo/${{ matrix.image.name }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image.name }}.cdx.json
          artifact-name: sbom-${{ matrix.image.name }}.cdx.json
          upload-artifact-retention: 30
      - name: Scan image for vulnerabilities (fail on fixable critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: zelvo/${{ matrix.image.name }}:ci
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pull requests scan only their own commits (origin/main..HEAD), so a finding already
      # accepted or fixed on main does not fail every pull request. Pushes to main keep
      # scanning the full history.
      - name: Gitleaks (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --log-opts="origin/${BASE_REF}..HEAD"
      - name: Gitleaks (full history)
        if: github.event_name != 'pull_request'
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
