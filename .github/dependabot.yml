version: 2
# Zelvo stays on long-term-support runtimes (.NET 10 LTS, Node 24 LTS).
# Major runtime upgrades are a stack change and need product owner approval,
# so Dependabot only proposes minor and patch updates for them.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      nuget: { patterns: ["*"] }
    ignore:
      # .NET framework packages follow the runtime major version (10.x)
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry majors change the telemetry pipeline (A5); upgrade by hand.
      - dependency-name: "OpenTelemetry*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directories: [/src/web, /tests/e2e]
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry majors change the telemetry pipeline (A5); upgrade by hand.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      # TypeScript and ESLint majors wait until the Next.js lint toolchain
      # (eslint-config-next, typescript-eslint and its React/import/a11y
      # plugins) supports them. TypeScript 7 fails `npm run lint` outright
      # ("typescript-eslint does not support TS 7.0"); ESLint 10 is outside
      # those plugins' peer ranges. Upgrade both by hand when they catch up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /src/keycloak
    schedule: { interval: weekly }
    groups:
      maven: { patterns: ["*"] }
    ignore:
      # Keycloak libraries follow the Keycloak image; upgrade both together by hand.
      - dependency-name: "org.keycloak:*"
  - package-ecosystem: docker
    directories: [/src/api/Zelvo.Api, /src/worker/Zelvo.Worker, /src/web, /src/keycloak, /deploy/opensearch]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly }
    ignore:
      # The UAE PASS mock runs in the official Node image; it follows the Node LTS line (PR #37
      # proposed Node 26, which is not LTS).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # OpenTelemetry majors change the telemetry pipeline (A5); upgrade by hand.
      - dependency-name: "otel/opentelemetry-collector*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
